<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kênh truyền hình</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3efe8; --surface: #fffdf9; --ink: #1c2230; --muted: #6b7280;
  --line: #e2dccf; --accent: #e03a3e; --shadow: 0 1px 0 rgba(28,34,48,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151c; --surface: #1b202b; --ink: #f1ede4; --muted: #9aa1ae;
    --line: #2b3240; --accent: #ff5a5f; --shadow: none;
  }
}
* { box-sizing: border-box; }
html { color-scheme: light dark; }
body {
  margin: 0; padding: 40px 20px 60px;
  font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  background: var(--bg); color: var(--ink); line-height: 1.5;
}
.wrap { max-width: 760px; margin: 0 auto; }
header { margin-bottom: 28px; }
h1 {
  margin: 0 0 6px; font-size: clamp(2rem, 6vw, 3rem); font-weight: 800;
  letter-spacing: -0.03em; line-height: 1.05; display: flex; align-items: center; gap: 14px;
}
.live-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); animation: pulse 1.8s ease-out infinite; flex: none; }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); }
  100% { box-shadow: 0 0 0 14px transparent; }
}
.sub { margin: 0; color: var(--muted); font-size: .95rem; }
.search { position: sticky; top: 12px; z-index: 20; margin: 0 0 32px; }
.search input {
  width: 100%; padding: 14px 18px; font: inherit; color: var(--ink); background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 999px; outline: none;
}
.search input:focus { border-color: var(--ink); }
section { margin-bottom: 34px; }
h2 {
  display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; font-size: 1.1rem; font-weight: 700;
  padding-bottom: 8px; border-bottom: 2px solid var(--ink);
}
h2 small { font-weight: 400; color: var(--muted); font-size: .85rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }

.channel { position: relative; display: flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); transition: border-color .15s; }
.channel:hover { border-color: var(--ink); }
.channel.off { opacity: .5; }
.open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; padding: 12px 10px 12px 12px; color: var(--ink); text-decoration: none; border-radius: 12px; }
.open:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.logo { flex: none; width: 56px; height: 40px; display: grid; place-items: center; background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.logo img { max-width: 100%; max-height: 100%; object-fit: contain; padding: 3px; }
.logo svg { width: 22px; height: 22px; fill: none; stroke: #9aa1ae; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.name { flex: 1; font-weight: 500; font-size: .98rem; min-width: 0; }
.cnt { color: var(--muted); font-weight: 400; font-size: .8rem; }
.play { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.channel:hover .play { background: var(--accent); color: #fff; }
.play svg { width: 12px; height: 12px; margin-left: 2px; fill: currentColor; }

.links { display: none; position: absolute; left: 0; right: 0; top: 100%; z-index: 10; margin-top: -1px; padding: 10px; gap: 6px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--ink); border-radius: 0 0 12px 12px; box-shadow: 0 8px 20px rgba(0,0,0,.18); }
.channel.multi:hover, .channel.multi:focus-within, .channel.multi.show { border-radius: 12px 12px 0 0; }
.channel.multi:hover .links, .channel.multi:focus-within .links, .channel.multi.show .links { display: flex; }
.links a { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); text-decoration: none; font-size: .85rem; font-weight: 500; }
.links a:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
.links a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.player { border: 0; padding: 0; width: min(960px, 96vw); background: #000; border-radius: 14px; overflow: hidden; }
.player::backdrop { background: rgba(0,0,0,.7); }
.player-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; background: var(--surface); color: var(--ink); font-size: .9rem; }
.player-bar span { display: flex; align-items: center; gap: 14px; }
.player-bar a { color: var(--accent); }
.player-bar button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.player-bar button:hover { border-color: var(--ink); }
.player-frame { position: relative; aspect-ratio: 16 / 9; background: #000; }
.player-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.empty { display: none; text-align: center; color: var(--muted); padding: 30px 0; }
@media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } .channel { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="live-dot"></span>Kênh truyền hình</h1>
    <p class="sub">Chọn một kênh để xem trực tiếp.</p>
  </header>
  <div class="search">
    <input id="q" type="search" placeholder="Tìm kênh…" aria-label="Tìm kênh" autocomplete="off">

  <p class="empty" id="empty">Không tìm thấy kênh nào. Thử từ khóa khác.</p>
</div>

<dialog class="player" id="player">
  <div class="player-bar">
    <strong id="pTitle"></strong>

  </div>
  <div class="player-frame" id="pFrame"></div>
</dialog>

  return s;
}

function render(term = "") {
  const t = term.trim().toLowerCase();
  const list = $("list");
  list.innerHTML = "";
  let total = 0;
  [...new Set(channels.map(c => c.group))].forEach(gn => {
    const items = channels.filter(c => c.group === gn && (!t || c.name.toLowerCase().includes(t)));
    if (!items.length) return;
    total += items.length;
    const sec = document.createElement("section");
    const h = document.createElement("h2");
    h.textContent = gn;
    const sm = document.createElement("small");
    sm.textContent = items.length + " kênh";
    h.appendChild(sm);
    const grid = document.createElement("div");
    grid.className = "grid";
    items.forEach(c => {
      const links = c.urls || (c.url ? [c.url] : []);
      const card = document.createElement("div");
      card.className = "channel";
      const a = document.createElement("a");
      a.className = "open";
      if (c.embed) {
        a.href = c.watch || c.embed;
        a.addEventListener("click", e => {
          if (e.ctrlKey || e.metaKey || e.shiftKey || e.button === 1) return;
          e.preventDefault();
          openPlayer(c);
        });
      } else if (links.length) a.href = links[0];
      else card.classList.add("off");
      const n = document.createElement("span");
      n.className = "name";
      n.textContent = c.name;
      const p = document.createElement("span");
      p.className = "play";
      p.innerHTML = PLAY;
      a.append(logoEl(logoSources(c)), n, p);
      card.appendChild(a);
      if (!c.embed && links.length > 1) {
        card.classList.add("multi");
        const k = document.createElement("small");
        k.className = "cnt";
        k.textContent = " · " + links.length + " link";
        n.appendChild(k);
        const box = document.createElement("div");
        box.className = "links";
        links.forEach((u, i) => {
          const b = document.createElement("a");
          b.href = u;
          b.textContent = "Link " + (i + 1);
          box.appendChild(b);
        });
        card.appendChild(box);
        a.addEventListener("click", e => {
          if (matchMedia("(hover: none)").matches) { e.preventDefault(); card.classList.toggle("show"); }
        });
      }
      grid.appendChild(card);
    });
    sec.append(h, grid);
    list.appendChild(sec);
  });
  $("empty").style.display = total ? "none" : "block";
}

/* ---- embed-only channels ---- */
function openPlayer(c) {
  if (!/^https:\/\//i.test(c.embed)) return;
  $("pTitle").textContent = c.name;
  $("pLink").href = c.watch || c.embed;
  const f = document.createElement("iframe");
  f.src = c.embed;
  f.title = c.name;
  f.allow = "autoplay; encrypted-media; fullscreen; picture-in-picture";
  f.allowFullscreen = true;
  $("pFrame").replaceChildren(f);
  $("player").showModal();
}
$("pClose").onclick = () => $("player").close();
$("player").addEventListener("close", () => $("pFrame").replaceChildren());
$("player").addEventListener("click", e => { if (e.target === $("player")) $("player").close(); });

$("q").addEventListener("input", e => render(e.target.value));
document.addEventListener("click", e => {
  document.querySelectorAll(".channel.show").forEach(c => { if (!c.contains(e.target)) c.classList.remove("show"); });
});
render();
</script>
</body>
</html>
