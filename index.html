
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 500px;
            margin: auto;
        }

        .link-button {
            display: block;
            width: 100%;
            padding: 18px;
            background: #2563eb;
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            border-radius: 10px;
            transition: background 0.2s, transform 0.2s;
        }

        .link-button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <h1>My Links</h1>

    <div class="button-container">

        <a class="link-button" href="https://google.com">
            Google
        </a>

        <a class="link-button" href="https://youtube.com">
            YouTube
        </a>

        <a class="link-button" href="https://github.com">
            GitHub
        </a>

        <a class="link-button" href="https://roblox.com">
            Roblox
        </a>

        <a class="link-button" href="https://wikipedia.org">
            Wikipedia
        </a>

    </div>

</body>
</html>
