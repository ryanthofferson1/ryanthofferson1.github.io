<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kênh truyền hình</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3efe8;
  --surface: #fffdf9;
  --ink: #1c2230;
  --muted: #6b7280;
  --line: #e2dccf;
  --accent: #e03a3e;
  --badge: #1c2230;
  --badge-ink: #fffdf9;
  --shadow: 0 1px 0 rgba(28,34,48,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151c;
    --surface: #1b202b;
    --ink: #f1ede4;
    --muted: #9aa1ae;
    --line: #2b3240;
    --accent: #ff5a5f;
    --badge: #f1ede4;
    --badge-ink: #12151c;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html { color-scheme: light dark; }
body {
  margin: 0;
  padding: 40px 20px 60px;
  font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
}
.wrap { max-width: 760px; margin: 0 auto; }

header { margin-bottom: 28px; }
h1 {
  margin: 0 0 6px;
  font-size: clamp(2rem, 6vw, 3rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.05;
  display: flex;
  align-items: center;
  gap: 14px;
}
.live-dot {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--accent);
  animation: pulse 1.8s ease-out infinite;
  flex: none;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); }
  100% { box-shadow: 0 0 0 14px transparent; }
}
.sub { margin: 0; color: var(--muted); font-size: 0.95rem; }

.search {
  position: sticky; top: 12px; z-index: 5;
  margin: 0 0 32px;
}
.search input {
  width: 100%;
  padding: 14px 18px;
  font: inherit;
  color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 999px;
  outline: none;
}
.search input:focus { border-color: var(--ink); }

section { margin-bottom: 34px; }
h2 {
  display: flex; align-items: baseline; gap: 10px;
  margin: 0 0 12px;
  font-size: 1.1rem; font-weight: 700;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--ink);
}
h2 small { font-weight: 400; color: var(--muted); font-size: 0.85rem; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 10px;
}
.channel { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); transition: border-color .15s; }
.channel:hover { border-color: var(--ink); }
.open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; padding: 12px 10px 12px 12px; color: var(--ink); text-decoration: none; border-radius: 12px; }
.open:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.logo { flex: none; width: 56px; height: 40px; display: grid; place-items: center; background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.logo img { max-width: 100%; max-height: 100%; object-fit: contain; padding: 3px; }
.logo svg { width: 22px; height: 22px; fill: none; stroke: #9aa1ae; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.name { flex: 1; font-weight: 500; font-size: .98rem; min-width: 0; }
.play { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.channel:hover .play { background: var(--accent); color: #fff; }
.play svg { width: 12px; height: 12px; margin-left: 2px; fill: currentColor; }
.player { border: 0; padding: 0; width: min(960px, 96vw); background: #000; border-radius: 14px; overflow: hidden; }
.player::backdrop { background: rgba(0,0,0,.7); }
.player-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; background: var(--surface); color: var(--ink); font-size: .9rem; }
.player-bar span { display: flex; align-items: center; gap: 14px; }
.player-bar a { color: var(--accent); }
.player-bar button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.player-bar button:hover { border-color: var(--ink); }
.player-frame { position: relative; aspect-ratio: 16 / 9; background: #000; }
.player-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.empty { display: none; text-align: center; color: var(--muted); padding: 30px 0; }

@media (prefers-reduced-motion: reduce) {
  .live-dot { animation: none; }
  .channel { transition: none; }
}
</style>
</head>

    <p class="sub">Chọn một kênh để xem trực tiếp.</p>

  <div class="search">
    <input id="q" type="search" placeholder="Tìm kênh…" aria-label="Tìm kênh" autocomplete="off">

  <div class="player-frame" id="pFrame"></div>

/* ===== Logo settings ===== */
const LOGO_DIR = "logo/";                                            // folder that holds the logo files
const LOGO_EXTS = ["png", "jpg", "jpeg", "webp", "svg", "gif", "avif"]; // file types to try
const slug = t => t.toLowerCase().replace(/đ/g, "d").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
// Looks for logo/<channel name>.<any type>. Optional: logo = full link, file = a different file name.
function logoSources(c) {
  if (c.logo) return [c.logo];
  const base = (c.file || slug(c.name)).replace(/\.[a-z0-9]+$/i, "");
  return [...LOGO_EXTS, ...LOGO_EXTS.map(e => e.toUpperCase())].map(e => LOGO_DIR + base + "." + e);
}
/* ========================= */


const $ = id => document.getElementById(id);
const TV = '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M9 21h6M12 18v3"/></svg>';
const PLAY = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M0 0l12 6-12 6z"/></svg>';

const channels = [];
groups.forEach(g => g.channels.forEach(c => channels.push({ ...c, group: g.title })));

function logoEl(src) {
  const list = Array.isArray(src) ? src.slice() : (src ? [src] : []);
  const s = document.createElement("span");
  s.className = "logo";
  const icon = () => { s.innerHTML = TV; };
  if (!list.length) { icon(); return s; }
  const i = document.createElement("img");
  i.alt = "";
  i.onerror = () => { list.shift(); if (list.length) i.src = list[0]; else icon(); };
  i.src = list[0];
  s.appendChild(i);
  return s;
}

function render(term = "") {
  const t = term.trim().toLowerCase();
  const list = $("list");
  list.innerHTML = "";
  let total = 0;
  [...new Set(channels.map(c => c.group))].forEach(gn => {
    const items = channels.filter(c => c.group === gn && (!t || c.name.toLowerCase().includes(t)));
    if (!items.length) return;
    total += items.length;
    const sec = document.createElement("section");
    const h = document.createElement("h2");
    h.textContent = gn;
    const sm = document.createElement("small");
    sm.textContent = items.length + " kênh";
    h.appendChild(sm);
    const grid = document.createElement("div");
    grid.className = "grid";
    items.forEach(c => {
      const card = document.createElement("div");
      card.className = "channel";
      const a = document.createElement("a");
      a.className = "open";
      a.href = c.embed ? (c.watch || c.embed) : c.url;
      if (c.embed) a.addEventListener("click", e => {
        if (e.ctrlKey || e.metaKey || e.shiftKey || e.button === 1) return;
        e.preventDefault();
        openPlayer(c);
      });
      const n = document.createElement("span");
      n.className = "name";
      n.textContent = c.name;
      const p = document.createElement("span");
      p.className = "play";
      p.innerHTML = PLAY;
      a.append(logoEl(logoSources(c)), n, p);
      card.appendChild(a);
      grid.appendChild(card);
    });
    sec.append(h, grid);
    list.appendChild(sec);
  });
  $("empty").style.display = total ? "none" : "block";
}

/* ---- embed-only channels ---- */
function openPlayer(c) {
  if (!/^https:\/\//i.test(c.embed)) return;
  $("pTitle").textContent = c.name;
  const l = $("pLink");
  l.href = c.watch || c.embed;
  l.hidden = false;
  const f = document.createElement("iframe");
  f.src = c.embed;
  f.title = c.name;
  f.allow = "autoplay; encrypted-media; fullscreen; picture-in-picture";
  f.allowFullscreen = true;
  $("pFrame").replaceChildren(f);
  $("player").showModal();
}
$("pClose").onclick = () => $("player").close();
$("player").addEventListener("close", () => $("pFrame").replaceChildren());
$("player").addEventListener("click", e => { if (e.target === $("player")) $("player").close(); });

$("q").addEventListener("input", e => render(e.target.value));
render();
